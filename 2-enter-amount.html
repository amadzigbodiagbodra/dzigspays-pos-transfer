<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DzigsPay – Enter amount</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1A24;--muted:#4F5E69;--line:#D7DDD9;--brand:#0B6B58;--bad:#A61B1B}
*{box-sizing:border-box}
body{margin:0;background:#E3E8E5;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink)}
.preview{max-width:390px;margin:0 auto;padding:12px 16px 8px;font-size:12px;color:var(--muted)}
.preview .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.preview button{font:inherit;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid #B9C3BD;background:#fff;color:var(--ink);cursor:pointer}
.app{max-width:390px;min-height:844px;margin:0 auto 24px;background:#F4F6F4;display:flex;flex-direction:column}
@media(min-width:430px){.app{border-radius:28px;box-shadow:0 8px 30px rgba(14,26,36,.12);overflow:hidden}}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.prog{display:flex;gap:6px;padding:20px 20px 0}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--brand)}
.head{padding:20px 20px 0}.step{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
h1{margin:8px 0 0;font-family:'Space Grotesk',sans-serif;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.amt{margin:16px 20px 0;padding:18px 20px;border-radius:18px;background:#fff;border:2px solid var(--line)}
.amt.ok{border-color:var(--brand)}.amt.bad{border-color:var(--bad)}
.amt .lbl{font-size:13px;font-weight:500;color:var(--muted)}
.amt .val{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.amt .cur{font-size:20px;font-weight:600;color:var(--muted)}
.amt .num{font-family:'Space Grotesk',sans-serif;font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amt.bad .num{color:var(--bad)}
.amt .lim{margin-top:8px;font-size:13px;color:var(--muted)}
.msg{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:10px;background:#EEF1EF;color:var(--muted);font-size:14px;font-weight:500;line-height:1.3}
.ok .msg{background:#E3F2EE;color:var(--brand)}.bad .msg{background:#FDEAEA;color:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 20px 0}
.pad button{height:56px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 24px 'Space Grotesk',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foot{margin-top:auto;display:flex;gap:10px;padding:16px 20px 24px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;height:56px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:600 17px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.sec{flex:none;width:104px;background:transparent;border:1.5px solid #B9C3BD;color:var(--ink);font-size:16px}
.btn:disabled{background:#E3E7E5;color:#5E6C75;cursor:not-allowed}
</style>
</head>
<body>

<div class="preview">
Preview state (design aid, not part of the screen)
<div class="row">
<button type="button" data-c="25000">GHS 250.00</button>
<button type="button" data-c="5500000">Above limit</button>
<button type="button" data-c="50">Below minimum</button>
<button type="button" data-c="0">Empty</button>
</div>
</div>

<main class="app">
<div class="top">
<div class="brand"><svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#0B6B58"/><path d="M12 9h6.5a9 9 0 0 1 0 18H12z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M15 18h6" stroke="#8FE0C8" stroke-width="3" stroke-linecap="round"/></svg>DzigsPay</div>
<div class="chip"><span class="dot"></span>POS-0142</div>
</div>
<div class="prog"><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
<div class="head">
<div class="step">STEP 2 OF 5 · ACCOUNT TRANSFER</div>
<h1>Enter amount</h1>
</div>

<div class="amt" id="amt">
<div class="lbl">Amount to pay</div>
<div class="val"><span class="cur">GHS</span><span class="num" id="num">0.00</span></div>
<div class="lim">Min GHS 1.00 · Max GHS 50,000.00 · 2 decimal places</div>
<div class="msg" role="status" aria-live="polite"><svg id="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;display:none"></svg><span id="msg"></span></div>
</div>

<div class="pad" id="pad"></div>

<div class="foot" id="foot"></div>
</main>

<script>
(function () {
  var MIN = 100, MAX = 5000000, CAP = 99999999;
  var q = new URLSearchParams(location.search);
  var start = parseInt(q.get('c'), 10);
  var cents = isFinite(start) && start >= 0 ? start : 25000;

  var keys = ['1','2','3','4','5','6','7','8','9','00','0','del'];
  var delSvg = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E1A24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="M12.5 10l4 4M16.5 10l-4 4"/></svg>';
  document.getElementById('pad').innerHTML = keys.map(function (k) {
    return '<button type="button" data-k="' + k + '" aria-label="' + (k === 'del' ? 'Delete last digit' : k) + '">' + (k === 'del' ? delSvg : k) + '</button>';
  }).join('');

  function fmt(c) {
    return String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(c % 100).padStart(2, '0');
  }
  var check = '<path d="M5 12.5l4.5 4.5L19 7.5"/>';
  var warn = '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/>';

  function render() {
    var status = 'ok', text = 'Amount is within limits.';
    if (cents === 0) { status = 'empty'; text = 'Enter the amount the customer will pay.'; }
    else if (cents < MIN) { status = 'bad'; text = 'Minimum transfer is GHS 1.00.'; }
    else if (cents > MAX) { status = 'bad'; text = 'Maximum transfer is GHS 50,000.00 per payment.'; }
    var valid = status === 'ok';
    document.getElementById('num').textContent = fmt(cents);
    document.getElementById('msg').textContent = text;
    var box = document.getElementById('amt');
    box.className = 'amt' + (valid ? ' ok' : '') + (status === 'bad' ? ' bad' : '');
    var ic = document.getElementById('ic');
    ic.style.display = status === 'empty' ? 'none' : 'block';
    ic.innerHTML = valid ? check : warn;
    // Invalid amounts can never reach the review step, so no transfer request can be made from here.
    document.getElementById('foot').innerHTML =
      '<a class="btn sec" href="1-select-method.html">Back</a>' +
      (valid ? '<a class="btn" href="3-review.html?c=' + cents + '">Review transfer</a>'
             : '<button type="button" class="btn" disabled>Review transfer</button>');
  }

  document.getElementById('pad').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var k = b.getAttribute('data-k'), next;
    if (k === 'del') next = Math.floor(cents / 10);
    else if (k === '00') next = cents * 100;
    else next = cents * 10 + Number(k);
    if (next > CAP) return;
    cents = next;
    render();
  });
  document.querySelector('.preview .row').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (b) { cents = Number(b.getAttribute('data-c')); render(); }
  });
  render();
})();
</script>
</body>
</html>
